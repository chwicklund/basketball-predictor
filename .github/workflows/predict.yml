# Logs a prediction for every game on today's schedule before tip-off: from noon
# US Eastern on weekends and federal holidays (afternoon games), 5 p.m. on other
# days (ml/schedule_time.py). Then redeploys so the calls show as pending; the
# nightly refresh grades them. A day that's already logged is never redone, and a
# game that has tipped off is skipped, so the first run after the slot does the work.
name: Daily predictions

on:
  schedule:
    # GitHub cron is UTC and often starts scheduled runs late (hours, at busy times), so
    # check every half hour from noon Eastern into the evening, off the busy top of the
    # hour. Runs before today's slot stop at the first step; later ones find the day
    # already logged and publish nothing.
    - cron: "7,37 16-23 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill: log this season's already-played games that have no call yet (marked as backfilled), instead of today's games"
        type: boolean
        default: false

concurrency:
  group: data  # shares the R2 tarball with nightly.yml and retrain.yml
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BUCKET: ${{ vars.R2_BUCKET || 'hoops-data' }}
  # onnxruntime-node (used only by the parity tests) would otherwise fetch optional CUDA
  # libraries during npm ci on x64 Linux, and that download fails; the CPU build is bundled
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No pip cache here: on runs that stop at the time check nothing is installed,
      # and the cache's cleanup step then fails the run
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Is it today's prediction time?
        id: clock
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else python -m ml.schedule_time >> "$GITHUB_OUTPUT"; fi

      # nbainjuries reads the NBA injury report PDF with tabula, which needs Java (JAVA_HOME)
      - uses: actions/setup-java@v4
        if: steps.clock.outputs.go == 'true'
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.go == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - name: Predict
        id: predict
        if: steps.clock.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          npm ci --prefix web
          npx --prefix web wrangler r2 object get "$BUCKET/state.tar.gz" --file state.tar.gz --remote
          tar xzf state.tar.gz
          # Writes logged=<games added> to $GITHUB_OUTPUT
          if [ "${{ inputs.backfill }}" = "true" ]; then python -m ml.predict --backfill; else python -m ml.predict; fi

      - name: Publish
        if: steps.clock.outputs.go == 'true' && steps.predict.outputs.logged != '0'
        run: |
          python -m ml.export
          mkdir -p predictions
          tar czf state.tar.gz bbref_games bbref_active_players ml/models predictions
          npx --prefix web wrangler r2 object put "$BUCKET/state.tar.gz" --file state.tar.gz --remote
          cd web && npm run build && npx wrangler deploy
